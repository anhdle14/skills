name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Type-check
        run: make check

      - name: Lint markdown
        run: make lint

      - name: Validate skill frontmatter
        run: make validate

      - name: Install smoke-test (copy)
        run: make copy DEST=/tmp/skills-test SKILLS="grill-me diagnose"

      - name: Verify copy output
        run: |
          test -f /tmp/skills-test/grill-me/SKILL.md
          test -f /tmp/skills-test/diagnose/SKILL.md
          test -f /tmp/skills-test/diagnose/scripts/hitl-loop.template.sh

      - name: Update index (idempotency check)
        run: make update-index && git diff --exit-code CLAUDE.md
